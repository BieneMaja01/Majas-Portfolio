<body>

</div>

<div id="face">
<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="45"
        fill="none"
        stroke="black"
        stroke-width="2"/>

    <circle cx="45" cy="50" r="3"/>
    <circle cx="75" cy="50" r="3"/>

    <path d="M45 78 Q60 88 75 78"
          fill="none"
          stroke="black"
          stroke-width="2"/>

    <path d="M60 50 L57 68 L63 68"
          fill="none"
          stroke="black"
          stroke-width="2"/>
</svg>
</div>

<script>
const face = document.getElementById("face");

let x = Math.random() * (window.innerWidth - 120);
let y = Math.random() * (window.innerHeight - 120);

face.style.left = x + "px";
face.style.top = y + "px";

function moveFace() {

    const targetX = Math.random() * (window.innerWidth - 120);
    const targetY = Math.random() * (window.innerHeight - 120);

    const rotation = Math.random() * 90 - 45;

    const duration = 8000 + Math.random() * 7000;

    face.animate(
        [
            {
                left: x + "px",
                top: y + "px",
                transform: "rotate(0deg)"
            },
            {
                left: targetX + "px",
                top: targetY + "px",
                transform: `rotate(${rotation}deg)`
            }
        ],
        {
            duration: duration,
            easing: "ease-in-out",
            fill: "forwards"
        }
    );

    x = targetX;
    y = targetY;

    setTimeout(() => {
        face.style.left = x + "px";
        face.style.top = y + "px";
        face.style.transform = `rotate(${rotation}deg)`;
        moveFace();
    }, duration);
}

moveFace();

</script>

</body>
